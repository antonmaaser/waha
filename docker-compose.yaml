# Runtime configuration: https://waha.devlike.pro/docs/how-to/config/
services:
  waha:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
    image: waha-local:gows-arm
    pull_policy: never
    platform: linux/arm64
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - './sessions:/app/.sessions'
      - './media:/app/.media'
    logging:
      driver: json-file
      options:
        max-size: '100m'
        max-file: '10'
